name: Deploy site to GitHub Pages

# Publishes a single GitHub Pages artifact containing:
#   - the portfolio (repository root: index.html, Assets, reelbook, reelbook-app)
#     served at  https://arshadhanif.github.io/
#   - the ERP Finance Pro Next.js site (built from ./erp-finance-pro with
#     basePath /erp-finance-pro) served at  https://arshadhanif.github.io/erp-finance-pro/
#
# The portfolio at the root is assembled verbatim from the existing static files,
# so it is unaffected by the ERP Finance Pro build.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp-finance-pro/package-lock.json

      - name: Build ERP Finance Pro (basePath /erp-finance-pro)
        working-directory: erp-finance-pro
        env:
          BASE_PATH: /erp-finance-pro
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Portfolio + co-hosted static apps at the root (served as-is).
          for path in index.html Assets reelbook reelbook-app vercel.json .nojekyll README.md; do
            if [ -e "$path" ]; then
              cp -r "$path" _site/
            fi
          done
          # ERP Finance Pro under /erp-finance-pro/
          mkdir -p _site/erp-finance-pro
          cp -r erp-finance-pro/out/* _site/erp-finance-pro/
          # Ensure Jekyll is disabled (Next.js uses _next directories).
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
